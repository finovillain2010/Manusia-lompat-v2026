<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Ular Tangga</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
    text-align:center;
}

table{
    border-collapse:collapse;
    margin:auto;
}

td{
    width:45px;
    height:45px;
    border:1px solid black;
    font-size:12px;
    text-align:center;
    vertical-align:middle;
    background:white;
}

button{
    padding:10px 20px;
    font-size:18px;
    margin:15px;
}

#info{
    font-size:22px;
    margin:10px;
}
</style>
</head>

<body>

<h1>Game Ular Tangga</h1>

<div id="info"></div>

<button onclick="rollDice()">Lempar Dadu</button>

<div id="board"></div>

<script>

let jumlahPlayer=parseInt(prompt("Masukkan jumlah pemain (2-4)",2));

if(jumlahPlayer<2) jumlahPlayer=2;
if(jumlahPlayer>4) jumlahPlayer=4;

const pemain=[];

for(let i=0;i<jumlahPlayer;i++){
    pemain.push({
        pos:1,
        warna:["🔴","🔵","🟢","🟡"][i]
    });
}

let giliran=0;

const snake={
17:7,
54:34,
62:19,
98:79
};

const ladder={
3:22,
8:30,
28:84,
58:77,
75:86,
80:99
};

function draw(){

let html="<table>";

for(let r=9;r>=0;r--){

html+="<tr>";

for(let c=0;c<10;c++){

let angka;

if(r%2==0)
angka=r*10+c+1;
else
angka=r*10+(10-c);

let isi=angka+"<br>";

pemain.forEach(p=>{
if(p.pos==angka)
isi+=p.warna;
});

html+="<td>"+isi+"</td>";

}

html+="</tr>";

}

html+="</table>";

document.getElementById("board").innerHTML=html;

document.getElementById("info").innerHTML=
"Giliran Player "+(giliran+1)+" "+pemain[giliran].warna;

}

function rollDice(){

let dadu=Math.floor(Math.random()*6)+1;

alert("Dadu : "+dadu);

let p=pemain[giliran];

if(p.pos+dadu<=100)
p.pos+=dadu;

if(ladder[p.pos]){
alert("Naik Tangga!");
p.pos=ladder[p.pos];
}

if(snake[p.pos]){
alert("Digigit Ular!");
p.pos=snake[p.pos];
}

if(p.pos==100){

alert("Player "+(giliran+1)+" Menang!");

location.reload();

return;

}

giliran++;

if(giliran>=jumlahPlayer)
giliran=0;

draw();

}

draw();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Manusia Lompat</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#87CEEB;
    overflow:hidden;
}
#game{
    width:800px;
    height:300px;
    background:#cceeff;
    border:3px solid #000;
    position:relative;
    overflow:hidden;
}
#player{
    width:40px;
    height:60px;
    background:blue;
    position:absolute;
    bottom:0;
    left:50px;
}
#obstacle{
    width:30px;
    height:50px;
    background:red;
    position:absolute;
    bottom:0;
    right:-30px;
    animation:jalan 2s linear infinite;
}
@keyframes jalan{
    from{right:-30px;}
    to{right:830px;}
}
.lompat{
    animation:lompat 0.5s;
}
@keyframes lompat{
    0%{bottom:0;}
    50%{bottom:120px;}
    100%{bottom:0;}
}
#score{
    position:absolute;
    top:10px;
    left:10px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<div id="game">
    <div id="score">Skor: 0</div>
    <div id="player"></div>
    <div id="obstacle"></div>
</div>

<script>
const player = document.getElementById("player");
const obstacle = document.getElementById("obstacle");
const scoreText = document.getElementById("score");

let score = 0;

document.addEventListener("keydown", lompat);
document.addEventListener("touchstart", lompat);

function lompat(){
    if(!player.classList.contains("lompat")){
        player.classList.add("lompat");
        setTimeout(()=>{
            player.classList.remove("lompat");
        },500);
    }
}

        location.reload();
    }

    scoreText.innerText = "Skor: " + score;
},100);
</script>

</body>
</html>

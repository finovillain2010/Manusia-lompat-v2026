<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mini Mario</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
}
canvas{
    display:block;
    margin:auto;
    background:#87CEEB;
}
</style>
</head>
<body>

<canvas id="game" width="900" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player={
    x:50,
    y:300,
    w:30,
    h:40,
    dx:0,
    dy:0,
    speed:4,
    jump:-12,
    grounded:false
};

const gravity=0.6;

const keys={};

const platforms=[
{x:0,y:340,w:900,h:60},
{x:180,y:280,w:120,h:20},
{x:380,y:230,w:120,h:20},
{x:600,y:180,w:120,h:20}
];

const goal={x:830,y:280,w:20,h:60};

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

function update(){

if(keys["ArrowLeft"]) player.dx=-player.speed;
else if(keys["ArrowRight"]) player.dx=player.speed;
else player.dx=0;

if((keys[" "]||keys["ArrowUp"])&&player.grounded){
player.dy=player.jump;
player.grounded=false;
}

player.dy+=gravity;
player.x+=player.dx;
player.y+=player.dy;

player.grounded=false;

for(let p of platforms){
if(player.x<p.x+p.w &&
player.x+player.w>p.x &&
player.y+player.h>p.y &&
player.y+player.h<p.y+20 &&
player.dy>=0){
player.y=p.y-player.h;
player.dy=0;
player.grounded=true;
}
}

if(player.x<0) player.x=0;

if(player.x+player.w>goal.x &&
player.y+player.h>goal.y){
alert("Selamat! Kamu Menang!");
location.reload();
}
}

function draw(){
ctx.clearRect(0,0,900,400);

ctx.fillStyle="#228B22";
for(let p of platforms){
ctx.fillRect(p.x,p.y,p.w,p.h);
}

ctx.fillStyle="red";
ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

ctx.fillStyle="white";
ctx.fillRect(goal.x+20,goal.y,30,20);

ctx.fillStyle="blue";
ctx.fillRect(player.x,player.y,player.w,player.h);
}

function game(){
update();
draw();
requestAnimationFrame(game);
}

game();
</script>

</body>
</html>

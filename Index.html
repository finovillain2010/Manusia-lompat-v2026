<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Manusia Lompat</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
}
#game{
    width:100vw;
    height:100vh;
    position:relative;
}
#player{
    width:40px;
    height:60px;
    background:red;
    position:absolute;
    left:50px;
    bottom:50px;
}
#ground{
    width:100%;
    height:50px;
    background:green;
    position:absolute;
    bottom:0;
}
#obstacle{
    width:30px;
    height:60px;
    background:black;
    position:absolute;
    right:-30px;
    bottom:50px;
    animation:move 2s linear infinite;
}
@keyframes move{
    from{right:-30px;}
    to{right:100%;}
}
.jump{
    animation:jump 0.6s ease;
}
@keyframes jump{
    0%{bottom:50px;}
    50%{bottom:180px;}
    100%{bottom:50px;}
}
</style>
</head>
<body>

<div id="game">
    <div id="player"></div>
    <div id="obstacle"></div>
    <div id="ground"></div>
</div>

<script>
const player = document.getElementById("player");

function jump(){
    if(player.classList.contains("jump")) return;
    player.classList.add("jump");
    setTimeout(()=>player.classList.remove("jump"),600);
}

document.addEventListener("keydown",e=>{
    if(e.code==="Space") jump();
});

document.addEventListener("touchstart",jump);

const obstacle=document.getElementById("obstacle");

setInterval(()=>{
    const playerBottom=parseInt(getComputedStyle(player).bottom);
    const obstacleLeft=obstacle.getBoundingClientRect().left;

    if(obstacleLeft<90 && obstacleLeft>20 && playerBottom<100){
        alert("Game Over!");
        location.reload();
    }
},20);
</script>

</body>
</html>

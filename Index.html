<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Game Manusia Lompat</title>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#87CEEB;
}
#game{
    width:800px;
    height:300px;
    border:3px solid #000;
    background:#fff;
    position:relative;
    overflow:hidden;
}
#player{
    width:40px;
    height:60px;
    background:#1e90ff;
    position:absolute;
    bottom:0;
    left:60px;
}
#obstacle{
    width:30px;
    height:60px;
    background:red;
    position:absolute;
    bottom:0;
    right:-30px;
}
#score{
    position:absolute;
    top:10px;
    left:10px;
    font:bold 20px Arial;
}
</style>
</head>
<body>

<div id="game">
    <div id="score">Skor: 0</div>
    <div id="player"></div>
    <div id="obstacle"></div>
</div>

<script>
const player = document.getElementById("player");
const obstacle = document.getElementById("obstacle");
const scoreText = document.getElementById("score");

let jumping = false;
let score = 0;
let obstacleX = 800;

function jump(){
    if(jumping) return;
    jumping = true;

    let up = setInterval(()=>{
        let bottom = parseInt(getComputedStyle(player).bottom);
        if(bottom >= 120){
            clearInterval(up);
            let down = setInterval(()=>{
                bottom = parseInt(getComputedStyle(player).bottom);
                if(bottom <= 0){
                    clearInterval(down);
                    jumping = false;
                }else{
                    player.style.bottom = (bottom - 5) + "px";
                }
            },20);
        }else{
            player.style.bottom = (bottom + 5) + "px";
        }
    },20);
}

document.addEventListener("keydown", e=>{
    if(e.code==="Space") jump();
});
document.addEventListener("touchstart", jump);

setInterval(()=>{
    obstacleX -= 5;
    if(obstacleX < -30){
        obstacleX = 800;
        score++;
        scoreText.textContent = "Skor: " + score;
    }
    obstacle.style.left = obstacleX + "px";

    let playerBottom = parseInt(getComputedStyle(player).bottom);

    if(obstacleX < 100 && obstacleX > 40 && playerBottom < 50){
        alert("Game Over!\nSkor: " + score);
        location.reload();
    }
},20);
</script>

</body>
</html>

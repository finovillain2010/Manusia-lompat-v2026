<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Run Game</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
}
canvas{
    display:block;
    margin:auto;
    background:#7CFC00;
}
</style>
</head>
<body>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
    x:50,
    y:300,
    w:40,
    h:40,
    vy:0,
    jump:false
};

let gravity = 0.8;
let obstacles = [];
let score = 0;

function spawnObstacle(){
    obstacles.push({
        x:800,
        y:320,
        w:30,
        h:80
    });
}

setInterval(spawnObstacle,1500);

document.addEventListener("keydown",e=>{
    if((e.code==="Space" || e.code==="ArrowUp") && !player.jump){
        player.vy=-15;
        player.jump=true;
    }
});

function update(){
    player.vy+=gravity;
    player.y+=player.vy;

    if(player.y>=300){
        player.y=300;
        player.vy=0;
        player.jump=false;
    }

    for(let i=0;i<obstacles.length;i++){
        obstacles[i].x-=6;

        if(
            player.x<obstacles[i].x+obstacles[i].w &&
            player.x+player.w>obstacles[i].x &&
            player.y<obstacles[i].y+obstacles[i].h &&
            player.y+player.h>obstacles[i].y
        ){
            alert("Game Over!\nSkor: "+score);
            location.reload();
        }
    }

    obstacles=obstacles.filter(o=>o.x>-50);
    score++;
}

function draw(){
    ctx.clearRect(0,0,800,400);

    ctx.fillStyle="blue";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    ctx.fillStyle="brown";
    obstacles.forEach(o=>{
        ctx.fillRect(o.x,o.y,o.w,o.h);
    });

    ctx.fillStyle="black";
    ctx.font="20px Arial";
    ctx.fillText("Skor: "+score,20,30);
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
